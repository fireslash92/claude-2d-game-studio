<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wildwood | Claude 3D Studio</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#173638;color:#f8e9c8;font:16px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}#hud>div{background:#102e32e8;border:1px solid #a4b5a877;padding:12px;border-radius:14px;height:max-content}h1{font:700 26px Georgia;margin:0 0 4px}#message{font-size:13px}#controls{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;display:grid;grid-template-columns:repeat(3,54px);gap:5px;touch-action:none}button{min-height:54px;border:1px solid #dce3b999;border-radius:12px;background:#173d44df;color:white;font-size:24px;touch-action:none;user-select:none}button:active{background:#588d76}#up{grid-column:2}#left{grid-row:2;grid-column:1}#down{grid-row:2;grid-column:2}#right{grid-row:2;grid-column:3}#credits{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));font-size:11px;background:#102e32d9;padding:8px;border-radius:8px}a{color:white}
</style></head><body><canvas id="view" aria-label="3D woodland game"></canvas><div id="hud"><div><h1>Wildwood</h1><div id="message">Loading the forest…</div></div><div id="count">✦ 0 / 5</div></div><div id="controls" aria-label="Movement"><button id="up" aria-label="Forward">↑</button><button id="left" aria-label="Left">←</button><button id="down" aria-label="Backward">↓</button><button id="right" aria-label="Right">→</button></div><div id="credits"><a href="https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/Fox">Fox credits</a> · CC BY 4.0</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script><script>
(async()=>{const msg=document.querySelector('#message'),count=document.querySelector('#count');try{
const B=window.BABYLON,engine=new B.Engine(document.querySelector('#view'),true);engine.setHardwareScalingLevel(Math.max(1,devicePixelRatio/1.5));const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.48,.69,.73,1);scene.fogMode=B.Scene.FOGMODE_EXP2;scene.fogColor=new B.Color3(.48,.69,.73);scene.fogDensity=.024;
const cam=new B.FreeCamera('camera',new B.Vector3(0,10,-14),scene);cam.setTarget(B.Vector3.Zero());new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene).intensity=.85;const sun=new B.DirectionalLight('sun',new B.Vector3(-.6,-1,.5),scene);sun.intensity=1.2;
const mat=(n,r,g,b)=>{const m=new B.StandardMaterial(n,scene);m.diffuseColor=new B.Color3(r,g,b);m.specularColor=new B.Color3(.04,.04,.04);return m;};const grass=mat('grass',.22,.42,.28),bark=mat('bark',.32,.20,.13),leaf=mat('leaf',.12,.33,.24),leaf2=mat('leaf2',.27,.47,.31),stone=mat('stone',.49,.54,.48),gold=mat('gold',.95,.65,.18);gold.emissiveColor=new B.Color3(.6,.32,.03);
const ground=B.MeshBuilder.CreateGround('ground',{width:56,height:56},scene);ground.material=grass;let seed=148;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};for(let i=0;i<65;i++){const x=(rand()-.5)*50,z=(rand()-.5)*50;if(Math.abs(x)<11&&Math.abs(z)<12)continue;const h=2+rand()*3;const t=B.MeshBuilder.CreateCylinder('trunk',{height:h,diameter:.36,tessellation:7},scene);t.position.set(x,h/2,z);t.material=bark;const c=B.MeshBuilder.CreateCylinder('crown',{height:h*1.5,diameterTop:0,diameterBottom:2.3+rand(),tessellation:7},scene);c.position.set(x,h*1.15,z);c.material=i%3?leaf:leaf2;}
const gems=[[-5,3],[6,5],[-8,-7],[9,-6],[0,10]].map(([x,z])=>{const a=B.MeshBuilder.CreatePolyhedron('shard',{type:1,size:.65},scene);a.position.set(x,.8,z);a.material=gold;const p=B.MeshBuilder.CreateCylinder('pedestal',{height:.3,diameter:1.4,tessellation:8},scene);p.position.set(x,.15,z);p.material=stone;return a;});const hero=new B.TransformNode('hero',scene);
let loaded;try{loaded=await B.SceneLoader.ImportMeshAsync('','https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/glTF-Binary/','Fox.glb',scene);}catch(e){msg.textContent='Model download failed. Check internet and refresh.';throw e;}
const root=loaded.meshes[0];root.parent=hero;root.scaling.setAll(.018);const groups=loaded.animationGroups;groups.forEach(g=>g.stop());const idle=groups.find(g=>/survey/i.test(g.name))||groups[0],walk=groups.find(g=>/walk/i.test(g.name))||groups[1]||idle;let current=idle;if(idle)idle.start(true);msg.textContent='Collect five golden shards. Use arrows or touch.';
const keys=new Set(),map={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};for(const [id,key] of Object.entries(map)){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(key);});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(key));}window.addEventListener('keydown',e=>{if(Object.values(map).includes(e.key)){e.preventDefault();keys.add(e.key);}});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());let total=0;
engine.runRenderLoop(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.05),x=Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')),z=Number(keys.has('ArrowUp'))-Number(keys.has('ArrowDown')),moving=x||z;if(moving){const len=Math.hypot(x,z);hero.position.x=B.Scalar.Clamp(hero.position.x+x/len*4*dt,-23,23);hero.position.z=B.Scalar.Clamp(hero.position.z+z/len*4*dt,-23,23);hero.rotation.y=Math.atan2(x,z);}const next=moving?walk:idle;if(next&&next!==current){if(current)current.stop();next.start(true);current=next;}for(const g of gems){if(g.isDisposed())continue;g.rotation.y+=dt;g.position.y=.8+Math.sin(performance.now()/450)*.15;if(Math.hypot(hero.position.x-g.position.x,hero.position.z-g.position.z)<1.25){g.dispose();count.textContent='✦ '+(++total)+' / 5';if(total===5)msg.textContent='Forest restored! All five shards collected.';}}cam.position=B.Vector3.Lerp(cam.position,hero.position.add(new B.Vector3(0,10,-14)),Math.min(1,dt*4));cam.setTarget(hero.position.add(new B.Vector3(0,1,2)));scene.render();});window.addEventListener('resize',()=>engine.resize());
}catch(e){console.error(e);if(msg.textContent==='Loading the forest…')msg.textContent='Unable to start WebGL. Check connection and browser.';}})();
</script></body></html>
